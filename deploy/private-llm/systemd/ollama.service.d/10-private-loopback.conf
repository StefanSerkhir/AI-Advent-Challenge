[Service]
# Keep the native Ollama API unreachable from the LAN/Internet. Nginx is the
# only network-facing process in this profile.
Environment="OLLAMA_HOST=127.0.0.1:11434"

# Runtime allocation used by the safe context-boundary check. The model
# metadata remains 40960; /api/ps reports the actual loaded value (4096 here).
Environment="OLLAMA_CONTEXT_LENGTH=4096"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
